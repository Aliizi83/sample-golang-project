definitions:
  dto.SendOtpRequest:
    properties:
      mobileNumber:
        maxLength: 11
        minLength: 11
        type: string
    required:
    - mobileNumber
    type: object
  helpers.BaseHttpResponse:
    properties:
      error: {}
      result: {}
      resultCode:
        type: integer
      success:
        type: boolean
      validationErrors:
        items:
          $ref: '#/definitions/validations.ValidationError'
        type: array
    type: object
  validations.ValidationError:
    properties:
      message:
        type: string
      property:
        type: string
      tag:
        type: string
      value:
        type: string
    type: object
info:
  contact: {}
paths:
  /v1/health:
    get:
      consumes:
      - application/json
      description: Health Check
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/helpers.BaseHttpResponse'
        "400":
          description: Failed
          schema:
            $ref: '#/definitions/helpers.BaseHttpResponse'
      summary: Health Check
      tags:
      - Health
  /v1/users/send-otp:
    post:
      consumes:
      - application/json
      description: Send otp to user
      parameters:
      - description: SendOtpRequest
        in: body
        name: Request
        required: true
        schema:
          $ref: '#/definitions/dto.SendOtpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Success
          schema:
            $ref: '#/definitions/helpers.BaseHttpResponse'
        "400":
          description: Failed
          schema:
            $ref: '#/definitions/helpers.BaseHttpResponse'
        "409":
          description: Failed
          schema:
            $ref: '#/definitions/helpers.BaseHttpResponse'
      summary: Send otp to user
      tags:
      - Users
swagger: "2.0"
